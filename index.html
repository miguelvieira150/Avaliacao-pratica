<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutStats - Placar ao Vivo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>⚽ FutStats</h1>
        <nav>
            <a href="#placar">Placar ao Vivo</a>
            <a href="#tabela">Tabela</a>
            <a href="#novo-jogo">Registrar Jogo</a>
        </nav>
    </header>

    <main>
        <section id="placar" class="card">
            <h2>Simulador de Partida</h2>
            <div class="scoreboard">
                <div class="team">
                    <h3>Time da Casa</h3>
                    <span id="gols-casa" class="score">0</span>
                    <button onclick="alterarGol('casa', 1)">+ Gol</button>
                </div>
                <div class="versus">X</div>
                <div class="team">
                    <h3>Time Visitante</h3>
                    <span id="gols-visitante" class="score">0</span>
                    <button onclick="alterarGol('visitante', 1)">+ Gol</button>
                </div>
            </div>
            <button class="btn-reset" onclick="zerarPlacar()">Zerar Placar</button>
        </section>
        <section id="tabela" class="card">
            <h2>Classificação do Campeonato</h2>
            <table>
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Time</th>
                        <th>Pts</th>
                        <th>PJ</th>
                        <th>V</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela">
                    <tr><td>1º</td><td>Flamengo</td><td>15</td><td>6</td><td>5</td></tr>
                    <tr><td>2º</td><td>Palmeiras</td><td>13</td><td>6</td><td>4</td></tr>
                    <tr><td>3º</td><td>São Paulo</td><td>10</td><td>6</td><td>3</td></tr>
                    <tr><td>4º</td><td>Grêmio</td><td>8</td><td>6</td><td>2</td></tr>
                </tbody>
            </table>
        </section>
